version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: college_erp_db
    restart: always
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: college_management
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. pgAdmin GUI for Database Administration (optional but helpful)
  pgadmin:
    image: dpage/pgadmin4
    container_name: college_erp_pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

  # 3. Node/Express Backend Server Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: college_erp_server
    restart: always
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/college_management
      DATABASE_SSL: "false"
      FORCE_MOCK_MODE: "false"
      JWT_SECRET: super_secret_jwt_key_12345_college_management
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost:5173
      EMAIL_USER: 23341a05d0@gmail.com
      EMAIL_PASS: "vger kaxv ezts pnfo"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      GOOGLE_CLIENT_ID: 58869313314-5rpg0hrsgt2f9sf8ugckrad38hr98d35.apps.googleusercontent.com
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - db

  # 4. Vite/React Frontend Client Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: college_erp_client
    restart: always
    ports:
      - "5174:5173"
    environment:
      VITE_GOOGLE_CLIENT_ID: 58869313314-5rpg0hrsgt2f9sf8ugckrad38hr98d35.apps.googleusercontent.com
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  postgres_data:
